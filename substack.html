  </header>

  <main class="substack">
    <h2>read the substack</h2>

    <p class="substack-intro">
      essays, analysis, and gilded lilies delivered to your inbox.
    </p>

    <a
      class="link-pill"
      href="https://gildedliliesclub.substack.com/subscribe"
      target="_blank"
      rel="noopener noreferrer"
    >subscribe</a>

    <section id="posts" class="posts" aria-live="polite" aria-label="Latest Substack article">
      <p>loading the latest essay...</p>
    </section>

    <a class="back" href="index.html">back to home</a>
  </main>

  <script>
    const FEED_ENDPOINT =
      'https://gilded-lilies-feed.prettycuriousclub.workers.dev';

    const box = document.getElementById('posts');
    const SUBSTACK_HOME = 'https://gildedliliesclub.substack.com';

    function getText(element, selector) {
      return element.querySelector(selector)?.textContent?.trim() || '';
    }

    function cleanHTML(html) {
      const doc = new DOMParser().parseFromString(
        html || '',
        'text/html'
      );

      doc.querySelectorAll('script, style, iframe, img').forEach(el => el.remove());

      return (doc.body.textContent || '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function findCoverImage(post) {
      // First, check the image URL added by the Cloudflare Worker.
      const workerImage = getText(post, 'coverImage');

      if (workerImage && /^https:\/\//i.test(workerImage)) {
        return workerImage;
      }

      // Try RSS thumbnail fields.
      const thumbnail = post.getElementsByTagNameNS('*', 'thumbnail')[0];

      if (thumbnail?.getAttribute('url')) {
        return thumbnail.getAttribute('url');
      }

      // Try media:content.
      const mediaContent = [...post.getElementsByTagNameNS('*', 'content')]
        .find(el => {
          const url = el.getAttribute('url');
          const type = el.getAttribute('medium') || '';

          return url && (
            type === 'image' ||
            /\.(jpg|jpeg|png|webp|gif)(\?|$)/i.test(url)
          );
        });

      if (mediaContent?.getAttribute('url')) {
        return mediaContent.getAttribute('url');
      }

      // Try an image enclosure.
      const enclosure = post.querySelector('enclosure[url]');

      if (enclosure) {
        const url = enclosure.getAttribute('url');
        const type = enclosure.getAttribute('type') || '';

        if (
          type.startsWith('image/') ||
          /\.(jpg|jpeg|png|webp|gif)(\?|$)/i.test(url)
        ) {
          return url;
        }
      }

      // Last attempt: look for an image in the article content.
      const encodedContent = post.getElementsByTagNameNS(
        '*',
        'encoded'
      )[0]?.textContent || '';

      const description = getText(post, 'description');
      const doc = new DOMParser().parseFromString(
        encodedContent || description,
        'text/html'
      );

      const image = doc.querySelector('img');

      return image?.getAttribute('src') ||
        image?.getAttribute('data-src') ||
        '';
    }

    function showFallback() {
      box.replaceChildren();

      const message = document.createElement('p');
      message.textContent =
        'The latest essay could not load right now. You can still read it on Substack.';

      const link = document.createElement('a');
      link.className = 'read-more';
      link.href = SUBSTACK_HOME;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = 'visit Gilded Lilies on Substack →';

      box.append(message, link);
    }

    async function loadPosts() {
      try {
        const response = await fetch(FEED_ENDPOINT);

        if (!response.ok) {
          throw new Error('Feed unavailable');
        }

        const xmlText = await response.text();
        const xml = new DOMParser().parseFromString(
          xmlText,
          'application/xml'
        );

        if (xml.querySelector('parsererror')) {
          throw new Error('Invalid RSS feed');
        }

        const post = xml.querySelector('channel > item');

        if (!post) {
          throw new Error('No posts found');
        }

        const titleText = getText(post, 'title') || 'Latest essay';
        const linkText = getText(post, 'link');
        const dateText = getText(post, 'pubDate');
        const descriptionText = getText(post, 'description');

        if (!linkText) {
          throw new Error('Post link missing');
        }

        const published = new Date(dateText);
        const dateLabel = Number.isNaN(published.getTime())
          ? ''
          : published.toLocaleDateString('en-US', {
              month: 'long',
              day: 'numeric',
              year: 'numeric'
            });

        let excerptText = cleanHTML(descriptionText)
          .replace(/^Listen now \(\d+ mins?\)\s*\|\s*/i, '');

        const maxLength = 650;

        if (excerptText.length > maxLength) {
          excerptText = excerptText.slice(0, maxLength).trim() + '…';
        }

        const card = document.createElement('article');
        card.className = 'post-card';

        const coverUrl = findCoverImage(post);

        if (coverUrl) {
          const image = document.createElement('img');
          image.className = 'post-cover';
          image.src = coverUrl;
          image.alt = 'Cover image for ' + titleText;
          image.loading = 'lazy';

          image.addEventListener('error', () => {
            image.remove();
          }, { once: true });

          card.appendChild(image);
        }

        const content = document.createElement('div');
        content.className = 'post-content';

        if (dateLabel) {
          const date = document.createElement('span');
          date.className = 'post-date';
          date.textContent = dateLabel;
          content.appendChild(date);
        }

        const title = document.createElement('h3');
        title.textContent = titleText;

        const excerpt = document.createElement('p');
        excerpt.className = 'post-excerpt';
        excerpt.textContent =
          excerptText || 'Read the latest essay from Gilded Lilies.';

        const readMore = document.createElement('a');
        readMore.className = 'read-more';
        readMore.href = linkText;
        readMore.target = '_blank';
        readMore.rel = 'noopener noreferrer';
        readMore.textContent = 'read the full article →';

        content.append(title, excerpt, readMore);
        card.appendChild(content);
        box.replaceChildren(card);

      } catch (error) {
        console.error('Unable to load Substack preview:', error);
        showFallback();
      }
    }

    loadPosts();
  </script>
</body>
</html>
